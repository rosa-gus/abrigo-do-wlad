name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-history:
    name: Secret history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      VITE_RECAPTCHA_PUBLIC_KEY: ci-public-value
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run check:secrets
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck:worker
      - run: npm run typecheck:admin-worker
      - run: npm run test:unit
      - run: npm run test:frontend
      - run: npm run test:worker
      - run: npm run test:rules
      - run: npm run check:public-worker
      - run: npm run check:admin-worker
      - run: npm run check:cron
